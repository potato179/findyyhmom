<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>용현이 엄마 찾기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090909;color:#fff;font-family:"Noto Sans KR",Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:12px;overflow-x:hidden}
button{font:inherit}
#game{width:min(900px,100%);min-height:720px;background:#171717;border:3px solid #333;border-radius:18px;overflow:hidden;box-shadow:0 25px 80px #000;position:relative}
.screen{min-height:720px}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 20px;background:
radial-gradient(circle at 50% 35%,#343434 0,#171717 42%,#090909 100%)}
.warning{color:#ffda3e;font-size:12px;font-weight:900;letter-spacing:2px}
.logo{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(55px,12vw,110px);line-height:.82;letter-spacing:-4px;margin:25px 0 15px;transform:rotate(-2deg);text-shadow:5px 5px 0 #ff315d}
.logo small{display:block;font-family:"Noto Sans KR",sans-serif;font-size:18px;letter-spacing:1px;color:#aaa;text-shadow:none;margin-top:18px}
.startline{max-width:580px;color:#aaa;font-size:14px;line-height:1.8}
.startbtn{margin-top:25px;background:#ff315d;color:#fff;border:0;border-radius:8px;padding:17px 40px;font-size:20px;font-weight:1000;cursor:pointer;box-shadow:0 8px 0 #a71936}
.startbtn:active{transform:translateY(6px);box-shadow:0 2px 0 #a71936}
.tiny{margin-top:20px;color:#555;font-size:10px}
#play{display:none;background:#0f0f10}
.top{height:78px;background:#1d1d1f;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.chapter{font-size:12px;color:#ff315d;font-weight:1000}
.chapter b{display:block;color:#fff;font-size:18px;margin-top:3px}
.stats{display:flex;gap:7px}.stat{background:#29292b;border:1px solid #414145;border-radius:7px;padding:6px 10px;text-align:center;min-width:70px}.stat span{display:block;font-size:9px;color:#888}.stat b{font-size:15px}
.scene{position:relative;height:455px;overflow:hidden;background:#222}
.bg{position:absolute;inset:0;background:
linear-gradient(#252b38 0 62%,#383838 62% 100%)}
.window{position:absolute;left:7%;top:10%;width:27%;height:32%;background:#8ed5ef;border:8px solid #111;box-shadow:inset 0 0 0 5px #b9efff}
.window:before{content:"";position:absolute;left:48%;top:0;bottom:0;width:6px;background:#111}.window:after{content:"";position:absolute;top:47%;left:0;right:0;height:6px;background:#111}
.sofa{position:absolute;right:4%;bottom:17%;width:34%;height:105px;background:#6f4351;border:7px solid #111;border-radius:25px 25px 8px 8px}
.table{position:absolute;left:7%;bottom:12%;width:27%;height:24px;background:#a06b42;border:6px solid #111;border-radius:8px}.table:after{content:"";position:absolute;left:12%;right:12%;top:20px;height:90px;border-left:8px solid #111;border-right:8px solid #111}
.character{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:170px;height:270px;transition:.25s}
.body{position:absolute;bottom:0;left:25px;width:120px;height:150px;background:#4775d8;border:7px solid #111;border-radius:45px 45px 20px 20px}
.head{position:absolute;left:42px;top:15px;width:88px;height:98px;background:#f2b994;border:7px solid #111;border-radius:48% 48% 44% 44%}
.hair{position:absolute;left:-4px;top:-8px;width:90px;height:43px;background:#241b18;border:6px solid #111;border-radius:50px 50px 18px 18px}
.eye{position:absolute;top:51px;width:10px;height:14px;background:#111;border-radius:50%}.eye.l{left:19px}.eye.r{right:19px}
.mouth{position:absolute;left:31px;top:73px;width:26px;height:13px;border-bottom:5px solid #111;border-radius:50%}
.speech{position:absolute;left:calc(50% + 90px);bottom:65%;background:#fff;color:#111;border:4px solid #111;border-radius:12px;padding:9px 12px;font-weight:900;font-size:13px;max-width:250px;box-shadow:5px 5px 0 #000}
.speech:after{content:"";position:absolute;left:15px;bottom:-14px;border:7px solid transparent;border-top-color:#111}
#fx{position:absolute;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;z-index:20}
.fxtext{font-family:Impact,Arial Black,sans-serif;font-size:clamp(45px,11vw,100px);color:#ff315d;text-shadow:5px 5px #fff,-3px -3px #111;transform:rotate(-5deg);animation:slam .45s}
@keyframes slam{0%{transform:scale(3) rotate(-12deg);opacity:0}70%{transform:scale(.95) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(-5deg)}}
.dialog{min-height:135px;background:#151517;border-top:1px solid #333;padding:17px 20px}
.speaker{font-size:11px;color:#ff315d;font-weight:1000;margin-bottom:6px}
.text{font-size:16px;line-height:1.65;font-weight:800;min-height:54px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.choice{border:1px solid #444;background:#242427;color:#fff;border-radius:7px;padding:11px;text-align:left;cursor:pointer;font-weight:800}
.choice:hover{border-color:#ff315d;background:#2d2024}
.choice small{display:block;color:#777;margin-top:3px;font-size:9px}
#ending{display:none;position:absolute;inset:0;background:#080808;z-index:100;align-items:center;justify-content:center;padding:20px;text-align:center}
.endcard{width:min(650px,100%);border:2px solid #333;background:#151515;border-radius:15px;padding:30px 22px}
.endlabel{color:#ff315d;font-size:11px;font-weight:1000;letter-spacing:2px}
.endtitle{font-family:Impact,Arial Black,sans-serif;font-size:clamp(45px,10vw,90px);line-height:.9;margin:15px 0;letter-spacing:-2px}
.enddesc{color:#aaa;line-height:1.8;font-weight:700}
.restart{margin-top:20px;border:0;background:#ff315d;color:#fff;padding:14px 28px;border-radius:7px;font-weight:1000;cursor:pointer}
.shake{animation:shake .32s}@keyframes shake{20%{transform:translate(-8px,2px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.flash{animation:flash .25s}@keyframes flash{50%{filter:brightness(2.5)}}
@media(max-width:600px){
 body{padding:0}.screen{min-height:100vh}#game{border:0;border-radius:0;min-height:100vh}
 #play{min-height:100vh}.top{height:70px}.stats{gap:3px}.stat{min-width:54px;padding:5px 6px}
 .scene{height:48vh;min-height:390px}.speech{left:auto;right:5%;bottom:64%;max-width:45%}
 .dialog{min-height:190px}.choices{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="game">
<section id="title" class="screen">
<div class="warning">⚠️ 실종사건 제1호 / 경찰 신고 전 마지막 기회</div>
<div class="logo">용현이<br>엄마 찾기<small>THE MOM IS GONE</small></div>
<div class="startline">
용현이가 집에 왔는데 엄마가 없었다.<br>
전화했더니 받지 않았다.<br>
문자했더니 <b>“밥 먹었니?”</b>만 왔다.<br><br>
그래서 용현이는 깨달았다.<br>
<b>이건 평범한 실종이 아니라는 것을.</b>
</div>
<button class="startbtn" onclick="Game.start()">엄마를 찾는다</button>
<div class="tiny">※ 본 게임의 사건·인물·대사는 모두 게임적 허구입니다. 특히 용현이는 허구입니다.</div>
</section>

<section id="play" class="screen">
<div class="top">
<div class="chapter">CASE 001<b id="chapter">엄마가 사라졌다</b></div>
<div class="stats">
<div class="stat"><span>효도력</span><b id="score">0</b></div>
<div class="stat"><span>불효력</span><b id="bad">0</b></div>
<div class="stat"><span>단서</span><b id="clues">0/5</b></div>
</div>
</div>

<div class="scene" id="scene">
<div class="bg"></div><div class="window"></div><div class="sofa"></div><div class="table"></div>
<div class="character" id="char">
<div class="head"><div class="hair"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
<div class="body"></div>
</div>
<div class="speech" id="bubble">엄마가 없다.</div>
<div id="fx"><div class="fxtext" id="fxtext">뭐야?</div></div>
</div>

<div class="dialog">
<div class="speaker" id="speaker">용현이</div>
<div class="text" id="text">엄마가 없다. 이것은 매우 심각한 상황이다.</div>
<div class="choices" id="choices"></div>
</div>
</section>

<div id="ending">
<div class="endcard">
<div class="endlabel" id="endlabel">ENDING</div>
<div class="endtitle" id="endtitle"></div>
<div class="enddesc" id="enddesc"></div>
<div id="endscore" style="margin-top:15px;font-size:20px;font-weight:1000"></div>
<button class="restart" onclick="Game.start()">다시 찾기</button>
</div>
</div>
</div>

<script>
const Game=(()=>{
let s={},step=0;

const $=id=>document.getElementById(id);
const scenarios=[
 {speaker:"용현이",text:"엄마가 없다. 집 안을 세 번 돌았는데 없다. 냉장고는 열려 있다. 김치는 있다.",choices:[
  ["엄마한테 전화한다","전화부터 한다.",2],
  ["냉장고를 조사한다","일단 먹을 걸 찾는다.",1],
  ["경찰에 신고한다","너무 이르다. 하지만 멋있다.",3]]},
 {speaker:"용현이",text:"냉장고 안에서 메모를 발견했다. <b>“용현아, 시장 좀 다녀올게.”</b>",choices:[
  ["시장으로 간다","정상적인 선택이다.",4],
  ["메모 뒷면을 확인한다","수상한 느낌이 난다.",5],
  ["김치를 먹는다","단서가 될 수도 있다.",6]]},
 {speaker:"엄마",text:"뚜— 뚜— 전화 연결음이 간다. 그런데 누군가 받았다.",choices:[
  ["“엄마?”라고 묻는다","가장 정상적인 반응.",7],
  ["“누구세요?”라고 묻는다","일단 경계한다.",8],
  ["말없이 끊는다","왜 전화했냐.",9]]},
 {speaker:"경찰",text:"경찰서에 전화했다. 경찰이 물었다. <b>“실종자의 특징이 어떻게 됩니까?”</b>",choices:[
  ["“엄마입니다.”","매우 정확한 설명.",10],
  ["“밥을 잘 해줍니다.”","그건 특징인가?",11],
  ["“저보다 무섭습니다.”","경찰이 잠시 침묵했다.",12]]},
 {speaker:"시장",text:"시장에 도착했다. 상인 3명이 동시에 용현이를 쳐다본다.",choices:[
  ["“혹시 엄마 보셨어요?”","정공법.",13],
  ["“엄마!!!” 하고 외친다","시장 전체가 쳐다본다.",14],
  ["아무 말 없이 생선 코너로 간다","왜?",15]]},
 {speaker:"메모",text:"뒷면에는 이상한 글씨가 있다. <b>“용현아. 이걸 보고 있다면 너는 꽤나 집요하구나.”</b>",choices:[
  ["계속 읽는다","더 큰 비밀이 있을지도.",16],
  ["찢어버린다","왜?",17],
  ["사진을 찍는다","증거 확보.",18]]},
 {speaker:"용현이",text:"김치를 먹었다. 맛있다. 그러나 엄마 찾기와 무슨 관계인지 모르겠다.",choices:[
  ["계속 찾는다","정신을 차린다.",19],
  ["한 접시 더 먹는다","효도력 -50.",20],
  ["김치에게 말을 건다","상황이 심각하다.",21]]}
];

function start(){
 s={score:0,bad:0,clues:0,ended:false};step=0;
 $("title").style.display="none";$("play").style.display="block";$("ending").style.display="none";
 update();show(0);
}
function update(){
 $("score").textContent=s.score;$("bad").textContent=s.bad;$("clues").textContent=s.clues+"/5";
}
function show(index){
 const q=scenarios[index%scenarios.length];
 $("speaker").textContent=q.speaker;$("text").innerHTML=q.text;
 $("choices").innerHTML="";
 q.choices.forEach((c,i)=>{
  const b=document.createElement("button");b.className="choice";
  b.innerHTML=`${["①","②","③"][i]} ${c[0]}<small>${c[1]}</small>`;
  b.onclick=()=>choose(c[2],i,c[0]);
  $("choices").appendChild(b);
 });
 $("bubble").textContent=q.speaker==="엄마"?"전화기 너머에서 목소리가 들린다.":"엄마가 없다.";
}
function choose(next,i,label){
 s.score+=50;
 if(i===1){s.bad++;s.score-=20}
 if(i===2){s.bad+=2;s.score-=50}
 s.clues+=Math.random()<.48?1:0;
 update();
 fx(i===0?"좋은 선택":"왜 그걸 눌러",i===0);
 step++;
 special(next,label);
}
function special(next,label){
 const n=step;
 const routes=[
  {t:"전화가 연결됐다.",sp:"전화 너머",d:"“용현아?”<br><br>목소리는 엄마였다.<br>그런데 뒤에서 <b>“치킨 왔습니다!”</b>라는 소리가 들린다.",choices:[
   ["“엄마 어디야?”",24],["“치킨 뭐 시켰어?”",25],["“엄마 사랑해”",26]]},
  {t:"시장 상인",sp:"상인",d:"“용현이 엄마? 아까 봤지.”<br>용현이의 눈이 커졌다.<br>“근데 어디 갔는지는 말 안 해줄 거야.”",choices:[
   ["돈을 준다",27],["협박한다",28],["정중하게 부탁한다",29]]},
  {t:"갑자기",sp:"???",d:"화면이 흔들린다.<br><br><b>엄마:</b> “용현아.”<br><br>뒤에서 목소리가 들린다.",choices:[
   ["뒤를 본다",30],["안 본다",31],["엄마라고 대답한다",32]]}
 ];
 if(n===3){branch(routes[0]);return}
 if(n===6){branch(routes[1]);return}
 if(n===9){branch(routes[2]);return}
 if(n>=12){finale();return}
 show((next+n)%scenarios.length);
}
function branch(r){
 $("speaker").textContent=r.sp;$("text").innerHTML=r.d;$("choices").innerHTML="";
 r.choices.forEach((c,i)=>{
  let b=document.createElement("button");b.className="choice";b.innerHTML=`${i+1}. ${c[0]}<small>이 선택은 돌이킬 수 없을 수도 있습니다.</small>`;
  b.onclick=()=>{s.score+=i===0?150:30;s.bad+=i===2?1:0;update();step++;if(step>=12)finale();else show((c[1]+step)%scenarios.length)};$("choices").appendChild(b);
 });
}
function fx(t,good){
 const f=$("fx"),ft=$("fxtext");ft.textContent=t;f.style.display="flex";
 clearTimeout(f.t);f.t=setTimeout(()=>f.style.display="none",550);
 $("scene").classList.remove("shake");void $("scene").offsetWidth;if(!good)$("scene").classList.add("shake");
}
function finale(){
 const endings=[
  ["TRUE ENDING","엄마는 시장에서 장을 보고 있었다.","용현이: “엄마 왜 말도 없이 갔어!”<br>엄마: “김치 떨어졌잖아.”<br><br>사건의 전말은 김치였다."],
  ["BAD ENDING","용현이가 엄마를 찾았다.","엄마: “그래서 숙제는 했니?”<br><br>용현이는 다시 도망쳤다."],
  ["SECRET ENDING","엄마가 용현이를 찾고 있었다.","엄마: “용현아, 너 어디 갔었니?”<br>용현이: “엄마 찾으러.”<br>엄마: “내가 널 찾고 있었는데?”<br><br><b>수색 대상이 뒤바뀌었습니다.</b>"],
  ["??? ENDING","사실 엄마는 처음부터 집에 있었다.","엄마: “나 화장실 갔다 왔는데?”<br><br>용현이는 12분 동안 혼자 난리를 피웠다."],
  ["LEGENDARY ENDING","용현이는 엄마보다 치킨을 먼저 찾았다.","엄마: “치킨 식기 전에 먹자.”<br>용현이: “엄마 사랑해.”<br><br>인류는 평화를 되찾았다."]
 ];
 let idx=s.bad>=5?3:(s.score>800?2:Math.floor(Math.random()*endings.length));
 const e=endings[idx];
 $("endlabel").textContent=e[0];$("endtitle").textContent=e[1];$("enddesc").innerHTML=e[2];
 $("endscore").textContent=`효도력 ${s.score} / 불효력 ${s.bad}`;
 $("ending").style.display="flex";s.ended=true;
}
return{start};
})();
</script>
</body>
</html>
