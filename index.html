<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용현이 엄마 찾기</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #08090d;
  --panel: #11131a;
  --panel2: #181b23;
  --line: #2c303a;
  --text: #f5f5f7;
  --muted: #8e95a3;
  --pink: #ff4f86;
  --red: #ff5b5b;
  --yellow: #ffd45a;
  --green: #65dfa0;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    sans-serif;
}

body {
  display: flex;
  justify-content: center;
}

button {
  font: inherit;
}

#app {
  width: min(940px, 100%);
  min-height: 100vh;
  padding: 18px;
}

/* =========================
   START
========================= */

.screen {
  display: none;
}

.screen.active {
  display: block;
}

#startScreen {
  min-height: calc(100vh - 36px);
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#startScreen.active {
  display: flex;
}

.start-inner {
  width: min(700px, 100%);
}

.kicker {
  color: var(--pink);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.18em;
}

.start-title {
  margin: 16px 0;
  font-size: clamp(48px, 11vw, 100px);
  line-height: 0.9;
  letter-spacing: -0.08em;
}

.start-title span {
  color: var(--pink);
}

.start-description {
  color: var(--muted);
  line-height: 1.8;
}

.start-button {
  margin-top: 28px;
  width: min(330px, 100%);
  padding: 17px;
  border: 0;
  border-radius: 14px;
  background: var(--pink);
  color: white;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 15px 40px #ff4f8630;
}

.start-button:hover {
  filter: brightness(1.08);
}

.warning {
  margin: 20px auto 0;
  max-width: 520px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: #696f7b;
  background: #0d0f14;
  font-size: 11px;
}

/* =========================
   HEADER
========================= */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.brand {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.04em;
}

.brand span {
  color: var(--pink);
}

.case-number {
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 99px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
}

/* =========================
   HUD
========================= */

.hud {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.stat {
  min-width: 90px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
}

.stat b {
  display: block;
  font-size: 17px;
}

.stat small {
  color: var(--muted);
  font-size: 9px;
}

.progress {
  height: 5px;
  margin-bottom: 12px;
  overflow: hidden;
  border-radius: 99px;
  background: #191c24;
}

.progress i {
  display: block;
  width: 0;
  height: 100%;
  background: var(--pink);
  transition: width 0.3s ease;
}

/* =========================
   GAME
========================= */

.case {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel);
}

.scene {
  position: relative;
  height: 340px;
  overflow: hidden;
  background:
    linear-gradient(
      to bottom,
      #151821 0%,
      #151821 65%,
      #0c0e13 65%,
      #0c0e13 100%
    );
}

.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(
      115deg,
      transparent 0%,
      transparent 58%,
      #ffffff04 58%,
      #ffffff04 60%,
      transparent 60%
    );
}

/* window */

.window {
  position: absolute;
  top: 45px;
  right: 10%;
  width: 190px;
  height: 115px;
  border: 1px solid #3a4659;
  background:
    linear-gradient(135deg, #17273b, #0f1724);
}

.window::after {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  height: 100%;
  border-left: 1px solid #3a4659;
}

/* sofa */

.sofa {
  position: absolute;
  bottom: 36px;
  left: 7%;
  width: 290px;
  height: 75px;
  border: 1px solid #343a48;
  border-radius: 20px 20px 9px 9px;
  background: #1d222d;
}

/* table */

.table {
  position: absolute;
  right: 14%;
  bottom: 36px;
  width: 160px;
  height: 55px;
  border: 1px solid #343a48;
  border-radius: 9px;
  background: #1a1e27;
}

/* delivery box */

.delivery-box {
  position: absolute;
  right: 25%;
  bottom: 91px;
  width: 68px;
  height: 53px;
  display: grid;
  place-items: center;
  border: 2px solid #d1b78d;
  background: #a98d67;
  color: #51331c;
  font-weight: 1000;
  cursor: pointer;
  z-index: 3;
}

.delivery-box::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  border-top: 1px solid #735a3c;
}

/* 용현이 */

.character {
  position: absolute;
  bottom: 36px;
  left: 50%;
  width: 68px;
  height: 108px;
  cursor: pointer;
  transform: translateX(-50%);
  z-index: 4;
}

.character-head {
  width: 42px;
  height: 42px;
  margin: auto;
  border-radius: 50%;
  background: #e4b18d;
}

.character-body {
  height: 68px;
  border-radius: 17px 17px 8px 8px;
  background: #465065;
}

.character-tag {
  position: absolute;
  top: -28px;
  left: 50%;
  padding: 4px 7px;
  border: 1px solid #343944;
  border-radius: 6px;
  background: #090a0e;
  color: #d8dbe1;
  font-size: 10px;
  white-space: nowrap;
  transform: translateX(-50%);
}

/* =========================
   CONTENT
========================= */

.content {
  padding: 18px;
}

.chapter {
  color: var(--pink);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.12em;
}

.scene-title {
  margin: 5px 0 8px;
  font-size: 25px;
  letter-spacing: -0.05em;
}

.dialogue {
  min-height: 62px;
  color: #c4c8d1;
  line-height: 1.75;
}

.dialogue strong {
  color: white;
}

.choices {
  display: grid;
  gap: 8px;
  margin-top: 15px;
}

.choice {
  padding: 14px;
  border: 1px solid #303540;
  border-radius: 11px;
  background: var(--panel2);
  color: #eeeeef;
  text-align: left;
  cursor: pointer;
  transition: 0.15s;
}

.choice:hover {
  border-color: #5a616f;
  background: #1c2029;
}

.choice:active {
  transform: scale(0.985);
}

.choice.danger {
  border-color: #4d2d35;
}

.choice .number {
  display: inline-grid;
  width: 23px;
  height: 23px;
  margin-right: 7px;
  place-items: center;
  border-radius: 6px;
  background: #262a34;
  color: #aeb4bf;
  font-size: 11px;
  font-weight: 900;
}

/* =========================
   CLUES
========================= */

.clue-area {
  margin-top: 16px;
  padding-top: 11px;
  border-top: 1px solid var(--line);
}

.clue-title {
  color: #747b87;
  font-size: 10px;
  font-weight: 800;
}

.clues {
  display: flex;
  gap: 6px;
  margin-top: 7px;
  overflow-x: auto;
}

.clue {
  flex: 0 0 auto;
  padding: 6px 8px;
  border: 1px solid #343945;
  border-radius: 8px;
  background: #0d0f14;
  color: #b9bec8;
  font-size: 10px;
}

/* =========================
   ENDING
========================= */

.ending {
  padding: 65px 20px;
  text-align: center;
}

.ending-type {
  color: var(--pink);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.18em;
}

.ending h2 {
  margin: 12px 0;
  font-size: clamp(34px, 8vw, 52px);
  letter-spacing: -0.06em;
}

.ending-text {
  max-width: 600px;
  margin: auto;
  color: #b9bec8;
  line-height: 1.8;
}

.score {
  margin: 20px 0;
  color: #888f9b;
  font-size: 12px;
}

.end-buttons {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.end-buttons button {
  padding: 13px 20px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #1a1e27;
  color: white;
  font-weight: 800;
  cursor: pointer;
}

.end-buttons .primary {
  border-color: var(--pink);
  background: var(--pink);
}

/* =========================
   MODAL
========================= */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  place-items: center;
  padding: 20px;
  background: #000b;
}

.modal.show {
  display: grid;
}

.modal-box {
  width: min(500px, 100%);
  padding: 22px;
  border: 1px solid #383d48;
  border-radius: 16px;
  background: #14171e;
  box-shadow: 0 30px 80px #000;
}

.modal-box h3 {
  margin: 0 0 10px;
}

.modal-box p {
  color: #b9bec8;
  line-height: 1.8;
}

.modal-box button {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: var(--pink);
  color: white;
  font-weight: 900;
  cursor: pointer;
}

/* =========================
   EFFECT
========================= */

.shake {
  animation: shake 0.3s;
}

@keyframes shake {
  0%, 100% {
    transform: translateX(0);
  }

  25% {
    transform: translateX(-7px);
  }

  50% {
    transform: translateX(7px);
  }

  75% {
    transform: translateX(-4px);
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {
  #app {
    padding: 10px;
  }

  .scene {
    height: 280px;
  }

  .window {
    top: 35px;
    right: 5%;
    width: 125px;
    height: 80px;
  }

  .sofa {
    left: 4%;
    bottom: 35px;
    width: 220px;
    height: 62px;
  }

  .table {
    right: 6%;
    bottom: 35px;
    width: 120px;
    height: 48px;
  }

  .delivery-box {
    right: 19%;
    bottom: 82px;
    width: 60px;
    height: 49px;
  }

  .character {
    bottom: 34px;
  }

  .scene-title {
    font-size: 21px;
  }

  .content {
    padding: 15px;
  }

  .hud {
    gap: 5px;
  }

  .stat {
    min-width: 78px;
    padding: 8px 10px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     START SCREEN
========================= -->

<section id="startScreen" class="active">

  <div class="start-inner">

    <div class="kicker">
      A VERY SERIOUS INVESTIGATION
    </div>

    <h1 class="start-title">
      용현이<br>
      <span>엄마 찾기</span>
    </h1>

    <p class="start-description">
      엄마가 사라졌다.<br>
      김치는 있는데 엄마는 없다.<br>
      그리고 현관에는 정체불명의 택배가 있다.
    </p>

    <button class="start-button" onclick="startGame()">
      수사 시작
    </button>

    <div class="warning">
      ※ 이 게임은 진지하게 플레이할수록 손해를 볼 수 있습니다.
    </div>

  </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="gameScreen" class="screen">

  <div class="topbar">

    <div class="brand">
      용현이 <span>엄마 찾기</span>
    </div>

    <div class="case-number" id="caseNumber">
      CASE 01
    </div>

  </div>


  <div class="hud">

    <div class="stat">
      <b id="logic">50</b>
      <small>추리력</small>
    </div>

    <div class="stat">
      <b id="chaos">0</b>
      <small>병맛력</small>
    </div>

    <div class="stat">
      <b id="clueCount">0</b>
      <small>단서</small>
    </div>

  </div>


  <div class="progress">
    <i id="progressBar"></i>
  </div>


  <div class="case" id="caseBox">

    <div class="scene">

      <div class="window"></div>

      <div class="sofa"></div>

      <div class="table"></div>

      <div
        class="delivery-box"
        onclick="inspectBox()"
        title="택배 상자"
      >
        CJ
      </div>

      <div
        class="character"
        onclick="inspectYonghyeon()"
      >

        <div class="character-tag">
          용현이
        </div>

        <div class="character-head"></div>

        <div class="character-body"></div>

      </div>

    </div>


    <div class="content">

      <div
        class="chapter"
        id="chapter"
      ></div>

      <h2
        class="scene-title"
        id="sceneTitle"
      ></h2>

      <div
        class="dialogue"
        id="dialogue"
      ></div>

      <div
        class="choices"
        id="choices"
      ></div>


      <div class="clue-area">

        <div class="clue-title">
          확보한 단서
        </div>

        <div
          class="clues"
          id="clues"
        ></div>

      </div>

    </div>

  </div>

</section>


<!-- =========================
     ENDING
========================= -->

<section id="endingScreen" class="screen">

  <div class="case">

    <div class="ending">

      <div
        class="ending-type"
        id="endingType"
      ></div>

      <h2 id="endingTitle"></h2>

      <p
        class="ending-text"
        id="endingText"
      ></p>

      <div
        class="score"
        id="endingScore"
      ></div>

      <div class="end-buttons">

        <button
          class="primary"
          onclick="startGame()"
        >
          다시 수사하기
        </button>

        <button
          onclick="showCollection()"
        >
          엔딩 기록
        </button>

      </div>

    </div>

  </div>

</section>

</div>


<!-- =========================
     MODAL
========================= -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-box">

    <h3 id="modalTitle"></h3>

    <p id="modalText"></p>

    <button onclick="closeModal()">
      계속
    </button>

  </div>

</div>


<script>

/* =========================================
   GAME STATE
========================================= */

const state = {
  logic: 50,
  chaos: 0,
  clues: [],
  step: 0
};


/* =========================================
   SCENES
========================================= */

const scenes = [

  {
    chapter: "사건 발생",
    title: "엄마가 없다",

    dialogue: `
      거실에 들어왔다.
      <br><br>

      <strong>엄마가 없다.</strong>
      <br><br>

      그런데 TV는 켜져 있고,
      김치냉장고도 돌아간다.
      현관에는 택배가 하나 놓여 있다.
      <br><br>

      <strong>용현이: "뭐더냐."</strong>
    `,

    choices: [

      [
        "집을 샅샅이 조사한다",
        "inspect"
      ],

      [
        "엄마에게 전화한다",
        "call"
      ],

      [
        "경찰부터 부른다",
        "police",
        "danger"
      ]

    ]
  },


  {
    chapter: "첫 번째 단서",
    title: "김치의 상태가 이상하다",

    dialogue: `
      냉장고를 열었다.
      <br><br>

      김치통 위에 포스트잇이 있다.
      <br><br>

      <strong>"건드리지 마시오."</strong>
      <br><br>

      이런 문구는 보통 건드리라는 뜻이다.
    `,

    choices: [

      [
        "김치를 건드린다",
        "kimchi",
        "danger"
      ],

      [
        "포스트잇 뒷면을 본다",
        "note"
      ],

      [
        "김치를 보며 \"뭐더냐\" 한다",
        "think"
      ]

    ]
  },


  {
    chapter: "수상한 배송",
    title: "택배 상자",

    dialogue: `
      송장을 확인했다.
      <br>

      <strong>받는 사람: 용현이</strong>
      <br>

      보낸 사람: 없음
      <br><br>

      용현이는 상자를 바라보다가
      갑자기 입을 연다.
    `,

    choices: [

      [
        "\"엄마 이게 뭔지 알아요?\"",
        "cj"
      ],

      [
        "상자를 흔든다",
        "shake",
        "danger"
      ],

      [
        "송장 숫자를 기록한다",
        "invoice"
      ]

    ]
  },


  {
    chapter: "택배의 비밀",
    title: "상자 안에는",

    dialogue: `
      상자 안에는
      작은 리모컨,
      열쇠,
      영수증이 들어 있다.
      <br><br>

      영수증에는
      <strong>19:10 / 동네 마트</strong>
      가 찍혀 있다.
    `,

    choices: [

      [
        "열쇠를 챙긴다",
        "key"
      ],

      [
        "마트로 간다",
        "market"
      ],

      [
        "영수증을 의심한다",
        "doubt"
      ]

    ]
  },


  {
    chapter: "이상한 전화",
    title: "\"뭐더냐…\"",

    dialogue: `
      갑자기 전화가 온다.
      <br><br>

      발신자는 <strong>엄마</strong>.
      <br><br>

      전화를 받자
      3초간 정적이 흐른다.
      <br><br>

      그리고 작은 목소리가 들린다.
      <br><br>

      <strong>"뭐더냐…"</strong>
    `,

    choices: [

      [
        "\"엄마 어디예요?\"",
        "ask"
      ],

      [
        "통화를 녹음한다",
        "record"
      ],

      [
        "\"경찰 순찰차 세 대 보냅니다\"",
        "three",
        "danger"
      ]

    ]
  },


  {
    chapter: "동네 마트",
    title: "목격자",

    dialogue: `
      마트 직원이 용현이를 보자 말한다.
      <br><br>

      <strong>"어머니 찾으러 오셨어요?"</strong>
      <br><br>

      엄마는 19:10에 왔다가
      19:20쯤 편의점 방향으로 갔다고 한다.
    `,

    choices: [

      [
        "편의점 방향을 묻는다",
        "where"
      ],

      [
        "CCTV를 확인한다",
        "cctv"
      ],

      [
        "직원을 의심한다",
        "accuse",
        "danger"
      ]

    ]
  },


  {
    chapter: "편의점",
    title: "배달 기사",

    dialogue: `
      편의점 앞에서
      엄마와 뒷모습이 똑같은 사람이 보인다.
      <br><br>

      다가가자…
      <br><br>

      <strong>배달 기사다.</strong>
      <br><br>

      그런데 손에는
      집 열쇠와 똑같이 생긴 열쇠가 있다.
    `,

    choices: [

      [
        "열쇠를 어디서 났는지 묻는다",
        "delivery"
      ],

      [
        "\"CJ 대한통운이잖아요\"",
        "cj2"
      ],

      [
        "몰래 뒤를 따라간다",
        "follow",
        "danger"
      ]

    ]
  },


  {
    chapter: "마지막 단서",
    title: "엄마의 메모",

    dialogue: `
      집에 돌아오자
      식탁에 메모가 놓여 있다.
      <br><br>

      <strong>
      "용현아,
      찾는다고 다 찾는 게 아니다."
      </strong>
      <br><br>

      아래에는 딱 한 단어가 적혀 있다.

    `,

/* =========================================
   START
========================================= */

function startGame() {

  state.logic = 50;
  state.chaos = 0;
  state.clues = [];
  state.step = 0;

  document
    .getElementById("startScreen")
    .classList.remove("active");

  document
    .getElementById("endingScreen")
    .classList.remove("active");

  document
    .getElementById("gameScreen")
    .classList.add("active");

  render();

}


/* =========================================
   RENDER
========================================= */

function render() {

  const scene = scenes[state.step];

  document.getElementById("caseNumber").textContent =
    "CASE " +
    String(state.step + 1).padStart(2, "0");

  document.getElementById("chapter").textContent =
    scene.chapter;

  document.getElementById("sceneTitle").textContent =
    scene.title;

  document.getElementById("dialogue").innerHTML =
    scene.dialogue;

  document.getElementById("logic").textContent =
    state.logic;

  document.getElementById("chaos").textContent =
    state.chaos;

  document.getElementById("clueCount").textContent =
    state.clues.length;

  const progress =
    state.step /
    (scenes.length - 1) *
    100;

  document.getElementById("progressBar").style.width =
    progress + "%";


  const choices =
    document.getElementById("choices");

  choices.innerHTML = "";


  scene.choices.forEach((choice, index) => {

    const button =
      document.createElement("button");

    button.className =
      "choice " +
      (choice[2] || "");

    button.innerHTML =
      `<span class="number">${index + 1}</span>` +
      choice[0];

    button.onclick = () =>
      handleChoice(choice[1]);

    choices.appendChild(button);

  });


  const clues =
    document.getElementById("clues");

  clues.innerHTML = "";

  state.clues.forEach(clue => {

    const item =
      document.createElement("span");

    item.className = "clue";

    item.textContent = clue;

    clues.appendChild(item);

  });

}


/* =========================================
   CLUE
========================================= */

function addClue(text) {

  if (!state.clues.includes(text)) {
    state.clues.push(text);
  }

}


/* =========================================
   CHOICE HANDLER
========================================= */

function handleChoice(action) {

  const game =
    document.getElementById("caseBox");

  game.classList.remove("shake");

  void game.offsetWidth;


  const next = n => {
    state.step = n;
  };


  switch (action) {

    case "inspect":

      addClue("집 안에는 엄마가 없음");

      state.logic += 5;

      next(1);

      break;


    case "call":

      addClue("엄마 전화 연결 안 됨");

      state.logic += 3;

      next(1);

      break;


    case "police":

      state.chaos += 20;

      finish("police");

      return;


    case "kimchi":

      state.chaos += 12;

      state.logic -= 4;

      addClue("김치통 밑에 작은 열쇠");

      next(2);

      break;


    case "note":

      state.logic += 7;

      addClue("포스트잇 뒷면: 마트");

      next(2);

      break;


    case "think":

      state.chaos += 8;

      next(2);

      break;


    case "cj":

      state.chaos += 8;

      finish("cj");

      return;


    case "shake":

      state.logic -= 8;

      state.chaos += 10;

      game.classList.add("shake");

      addClue("상자에서 딸깍 소리");

      next(3);

      break;


    case "invoice":

      state.logic += 6;

      addClue("송장 숫자 1910");

      next(3);

      break;


    case "key":

      state.logic += 5;

      addClue("택배 속 열쇠");

      next(4);

      break;


    case "market":

      state.logic += 3;

      next(5);

      break;


    case "doubt":

      state.logic += 6;

      addClue("영수증: 19:10 마트");

      next(5);

      break;


    case "ask":

      state.logic += 4;

      addClue(
        "엄마가 전화로 '뭐더냐'라고 함"
      );

      next(5);

      break;


    case "record":

      state.logic += 9;

      addClue(
        "통화는 실시간 통화였다"
      );

      next(5);

      break;


    case "three":

      state.chaos += 20;

      finish("police");

      return;


    case "where":

      state.logic += 7;

      addClue(
        "엄마는 편의점 방향으로 이동"
      );

      next(6);

      break;


    case "cctv":

      state.logic += 11;

      addClue(
        "CCTV에서 엄마가 편의점으로 이동"
      );

      next(6);

      break;


    case "accuse":

      state.logic -= 12;

      state.chaos += 12;

      next(6);

      break;


    case "delivery":

      state.logic += 10;

      addClue(
        "배달 기사는 엄마의 주문을 배달 중"
      );

      next(7);

      break;


    case "cj2":

      state.chaos += 7;

      state.logic -= 3;

      next(7);

      break;


    case "follow":

      state.logic -= 10;

      state.chaos += 10;

      next(7);

      break;


    case "fridge":

      state.logic += 15;

      addClue(
        "냉장고 뒤에 주소가 적혀 있음"
      );

      if (state.logic >= 75) {
        finish("secret");
      } else {
        finish("true");
      }

      return;


    case "rip":

      state.logic -= 15;

      state.chaos += 15;

      finish("chaos");

      return;


    case "finalcall":

      if (state.clues.length >= 5) {
        finish("true");
      } else {
        finish("legendary");
      }

      return;

  }


  render();

}


/* =========================================
   ENDING
========================================= */

function finish(type) {

  const ending = endings[type];

  document
    .getElementById("gameScreen")
    .classList.remove("active");

  document
    .getElementById("endingScreen")
    .classList.add("active");


  document.getElementById("endingType")
    .textContent = ending.type;

  document.getElementById("endingTitle")
    .textContent = ending.title;

  document.getElementById("endingText")
    .innerHTML = ending.text;

  document.getElementById("endingScore")
    .textContent =
      `추리력 ${state.logic} · ` +
      `병맛력 ${state.chaos} · ` +
      `확보 단서 ${state.clues.length}개`;


  saveEnding(ending.type);

}


/* =========================================
   ENDING COLLECTION
========================================= */

function saveEnding(type) {

  let endings =
    JSON.parse(
      localStorage.getItem("yonghyeon_endings") ||
      "[]"
    );

  if (!endings.includes(type)) {

    endings.push(type);

    localStorage.setItem(
      "yonghyeon_endings",
      JSON.stringify(endings)
    );

  }

}


function showCollection() {

  const endings =
    JSON.parse(
      localStorage.getItem("yonghyeon_endings") ||
      "[]"
    );

  if (!endings.length) {

    openModal(
      "엔딩 기록",
      "아직 발견한 엔딩이 없습니다."
    );

    return;
  }


  openModal(
    "엔딩 기록",
    `
      발견한 엔딩:
      <br><br>

      ${endings
        .map(item => "• " + item)
        .join("<br>")}

      <br><br>

      <span style="color:#777">
      아직 발견하지 못한 엔딩도 어딘가에 존재한다.
      </span>
    `
  );

}

   INTERACTION
========================================= */

      중요한 순간에는 "뭐더냐"를 외치는 경향이 있다.
      </span>
    `

}


/* =========================================
   MODAL
========================================= */

function openModal(title, text) {

  document.getElementById("modalTitle")
    .textContent = title;

  document.getElementById("modalText")
    .innerHTML = text;

  document.getElementById("modal")
    .classList.add("show");

}


function closeModal() {

  document.getElementById("modal")
    .classList.remove("show");

}
